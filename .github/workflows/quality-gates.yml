name: AnotherLife Quality Gates

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
      - converted_to_draft
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    name: repository / hygiene
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        timeout-minutes: 5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Repository hygiene
        shell: pwsh
        timeout-minutes: 10
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $transcript = "artifacts/repository-hygiene.txt"
          try {
            & ./tools/ci/Invoke-AnotherLifeQualityGate.ps1 -Mode Hygiene *>&1 |
              Tee-Object -FilePath $transcript
            if ($LASTEXITCODE -ne 0) {
              throw "Repository hygiene exited with code $LASTEXITCODE."
            }
          } catch {
            $_ | Out-String | Add-Content -LiteralPath $transcript
            throw
          }
      - name: Six-family production authority gate
        shell: pwsh
        timeout-minutes: 5
        run: |
          $transcript = "artifacts/six-family-production-authority.txt"
          try {
            & python tools/game-data/test_validate_six_family_production_authority.py *>&1 |
              Tee-Object -FilePath $transcript
            if ($LASTEXITCODE -ne 0) {
              throw "Six-family production authority tests exited with code $LASTEXITCODE."
            }
            & python tools/game-data/validate_six_family_production_authority.py *>&1 |
              Tee-Object -FilePath $transcript -Append
            if ($LASTEXITCODE -ne 0) {
              throw "Six-family production authority audit exited with code $LASTEXITCODE."
            }
            & python tools/game-data/validate_six_family_production_authority.py --require-production-eligible *>&1 |
              Tee-Object -FilePath $transcript -Append
            if ($LASTEXITCODE -ne 2) {
              throw "Blocked v1 authority gate must exit 2, received $LASTEXITCODE."
            }
            $global:LASTEXITCODE = 0
          } catch {
            $_ | Out-String | Add-Content -LiteralPath $transcript
            throw
          }
      - name: Android Unity package verifier tests
        shell: pwsh
        timeout-minutes: 5
        run: |
          $transcript = "artifacts/android-unity-package-tests.txt"
          try {
            & py -3 -m unittest -v tools.tests.test_android_unity_package *>&1 |
              Tee-Object -FilePath $transcript
            if ($LASTEXITCODE -ne 0) {
              throw "Android Unity package verifier tests exited with code $LASTEXITCODE."
            }
          } catch {
            $_ | Out-String | Add-Content -LiteralPath $transcript
            throw
          }
      - name: Reproducible build contract
        shell: pwsh
        timeout-minutes: 10
        run: |
          $transcript = "artifacts/reproducible-build-contract.txt"
          try {
            & python -m unittest tools.tests.test_reproducible_build tools.tests.test_android_unity_package *>&1 |
              Tee-Object -FilePath $transcript
            if ($LASTEXITCODE -ne 0) {
              throw "Reproducible build contract tests exited with code $LASTEXITCODE."
            }
            & python tools/reproducible_build.py --repo-root . inventory *>&1 |
              Tee-Object -FilePath $transcript -Append
            if ($LASTEXITCODE -ne 0) {
              throw "Reproducible build inventory exited with code $LASTEXITCODE."
            }
          } catch {
            $_ | Out-String | Add-Content -LiteralPath $transcript
            throw
          }
      - name: Integrated deterministic QA contract
        shell: pwsh
        timeout-minutes: 15
        run: |
          $transcript = "artifacts/deterministic-qa-contract.txt"
          try {
            & python tools/qa/test_run_deterministic_qa.py *>&1 |
              Tee-Object -FilePath $transcript
            if ($LASTEXITCODE -ne 0) {
              throw "Deterministic QA contract tests exited with code $LASTEXITCODE."
            }
            & python tools/qa/run_deterministic_qa.py --repo-root . --profile contract --output-dir artifacts/deterministic-qa *>&1 |
              Tee-Object -FilePath $transcript -Append
            if ($LASTEXITCODE -ne 0) {
              throw "Deterministic QA fixture profile exited with code $LASTEXITCODE."
            }
          } catch {
            $_ | Out-String | Add-Content -LiteralPath $transcript
            throw
          }
      - name: Realm-slice evidence harness contract
        shell: pwsh
        timeout-minutes: 15
        run: |
          $transcript = "artifacts/realm-slice-evidence-contract.txt"
          try {
            & python -m pip install --disable-pip-version-check jsonschema==4.26.0 *>&1 |
              Tee-Object -FilePath $transcript
            if ($LASTEXITCODE -ne 0) {
              throw "Realm-slice schema dependency install exited with code $LASTEXITCODE."
            }
            & python tools/qa/test_realm_slice_evidence.py *>&1 |
              Tee-Object -FilePath $transcript -Append
            if ($LASTEXITCODE -ne 0) {
              throw "Realm-slice evidence contract tests exited with code $LASTEXITCODE."
            }
            & python tools/qa/test_realm_evidence_registry.py *>&1 |
              Tee-Object -FilePath $transcript -Append
            if ($LASTEXITCODE -ne 0) {
              throw "Realm evidence registry contract tests exited with code $LASTEXITCODE."
            }
            $registryPath = "unity/Docs/RealmSliceEvidenceRegistry/registry.v1.json"
            & python tools/qa/realm_evidence_registry.py verify --registry $registryPath *>&1 |
              Tee-Object -FilePath $transcript -Append
            if ($LASTEXITCODE -ne 0) {
              throw "Canonical realm evidence registry verification exited with code $LASTEXITCODE."
            }
          } catch {
            $_ | Out-String | Add-Content -LiteralPath $transcript
            throw
          }
      - name: Realm-creature production-slice qualification
        shell: pwsh
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $transcript = "artifacts/realm-creature-production-slice.txt"
          try {
            $include = @(
              "unity/ArtSource/Terrestrials/RealmCreatureProductionSourceV001/Models/boss_stonehold_fault_crowned_colossus/**",
              "unity/ArtSource/Terrestrials/RealmCreatureProductionSourceV001/Textures/boss_stonehold_fault_crowned_colossus/**",
              "unity/ArtSource/Terrestrials/RealmCreatureProductionSourceV001/ProductionSlices/FaultCrownedColossusV001/**",
              "unity/Docs/Terrestrials/RealmCreatureProductionSourceV001/ProductionSlices/FaultCrownedColossusV001/**",
              "unity/Docs/Terrestrials/RealmBossesAndElites/ConceptSheets/tdf_boss_stonehold_fault_crowned_colossus_concept_sheet_v001.png"
            ) -join ","
            if ($env:GITHUB_TOKEN) {
              $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x:$($env:GITHUB_TOKEN)"))
              & git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" lfs pull --include=$include *>&1 |
                Tee-Object -FilePath $transcript
            } else {
              & git lfs pull --include=$include *>&1 |
                Tee-Object -FilePath $transcript
            }
            if ($LASTEXITCODE -ne 0) {
              throw "Realm-creature production-slice LFS pull exited with code $LASTEXITCODE."
            }
            & python -m pip install --disable-pip-version-check jsonschema==4.26.0 *>&1 |
              Tee-Object -FilePath $transcript -Append
            if ($LASTEXITCODE -ne 0) {
              throw "Realm-creature production-slice schema dependency install exited with code $LASTEXITCODE."
            }
            & python tools/terrestrial/test_validate_realm_creature_production_slice.py *>&1 |
              Tee-Object -FilePath $transcript -Append
            if ($LASTEXITCODE -ne 0) {
              throw "Realm-creature production-slice tests exited with code $LASTEXITCODE."
            }
          } catch {
            $_ | Out-String | Add-Content -LiteralPath $transcript
            throw
          }
      - name: Shot070 Vaeloryn motion-source qualification
        shell: pwsh
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $transcript = "artifacts/shot070-vaeloryn-source.txt"
          try {
            $include = @(
              "unity/ArtSource/Cinematics/Shot070VaelorynSourceV002/**",
              "unity/Docs/Cinematics/Shot070VaelorynSourceV002/**",
              "unity/ArtSource/Terrestrials/RealmCreatureProductionSourceV001/Models/wish_dragon_vaeloryn/**",
              "unity/Docs/Terrestrials/RealmCreatureProductionSourceV001/ConceptSheets/55_vaeloryn_multiview_01_v001.png",
              "unity/Docs/Terrestrials/RealmCreatureProductionSourceV001/ConceptSheets/56_vaeloryn_multiview_02_v001.png"
            ) -join ","
            if ($env:GITHUB_TOKEN) {
              $basicAuth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x:$($env:GITHUB_TOKEN)"))
              $header = "AUTHORIZATION: basic $basicAuth"
              $lfsOutput = & git -c "http.https://github.com/.extraheader=$header" lfs pull --include=$include *>&1
              $lfsExit = $LASTEXITCODE
            } else {
              $lfsOutput = & git lfs pull --include=$include *>&1
              $lfsExit = $LASTEXITCODE
            }
            $lfsOutput | Tee-Object -FilePath $transcript
            if ($lfsExit -ne 0) {
              throw "Shot070 Vaeloryn motion-source LFS pull exited with code $lfsExit."
            }
            & python tools/cinematics/test_validate_shot070_vaeloryn_source.py *>&1 |
              Tee-Object -FilePath $transcript -Append
            if ($LASTEXITCODE -ne 0) {
              throw "Shot070 Vaeloryn motion-source tests exited with code $LASTEXITCODE."
            }
          } catch {
            $_ | Out-String | Add-Content -LiteralPath $transcript
            throw
          }
      - name: Boss and skill presentation catalog
        shell: pwsh
        timeout-minutes: 5
        run: |
          $transcript = "artifacts/boss-skill-presentation.txt"
          try {
            & python -m pip install --disable-pip-version-check jsonschema==4.26.0 *>&1 |
              Tee-Object -FilePath $transcript
            if ($LASTEXITCODE -ne 0) {
              throw "Boss/skill presentation schema dependency install exited with code $LASTEXITCODE."
            }
            & python tools/presentation/test_validate_boss_skill_presentation.py *>&1 |
              Tee-Object -FilePath $transcript -Append
            if ($LASTEXITCODE -ne 0) {
              throw "Boss/skill presentation tests exited with code $LASTEXITCODE."
            }
          } catch {
            $_ | Out-String | Add-Content -LiteralPath $transcript
            throw
          }
      - name: Quality-gate fixture proof
        shell: pwsh
        timeout-minutes: 10
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $transcript = "artifacts/quality-gate-fixtures.txt"
          try {
            & ./tools/ci/Test-AnotherLifeQualityGateFixtures.ps1 -Scenario All *>&1 |
              Tee-Object -FilePath $transcript
            if ($LASTEXITCODE -ne 0) {
              throw "Quality-gate fixtures exited with code $LASTEXITCODE."
            }
          } catch {
            $_ | Out-String | Add-Content -LiteralPath $transcript
            throw
          }
      - name: Golden-scene evidence validator fixtures
        shell: pwsh
        timeout-minutes: 5
        run: |
          $transcript = "artifacts/golden-scene-evidence-validator.txt"
          try {
            & python ./tools/benchmarks/test_validate_golden_scene_evidence.py *>&1 |
              Tee-Object -FilePath $transcript
            if ($LASTEXITCODE -ne 0) {
              throw "Golden-scene evidence validator fixtures exited with code $LASTEXITCODE."
            }
          } catch {
            $_ | Out-String | Add-Content -LiteralPath $transcript
            throw
          }
      - name: Upload quality-gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 10
        with:
          name: quality-gate-evidence-${{ github.run_attempt }}
          path: |
            artifacts/repository-hygiene.txt
            artifacts/six-family-production-authority.txt
            artifacts/android-unity-package-tests.txt
            artifacts/reproducible-build-contract.txt
            artifacts/deterministic-qa-contract.txt
            artifacts/deterministic-qa/report.json
            artifacts/deterministic-qa/junit.xml
            artifacts/deterministic-qa/logs/
            artifacts/realm-creature-production-slice.txt
            artifacts/shot070-vaeloryn-source.txt
            artifacts/boss-skill-presentation.txt
            artifacts/quality-gate-fixtures.txt
            artifacts/golden-scene-evidence-validator.txt
          if-no-files-found: error
          retention-days: 90

  android-unit-debug:
    name: android / unit-debug
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        timeout-minutes: 5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        timeout-minutes: 10
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle version
        shell: pwsh
        timeout-minutes: 5
        run: ./gradlew.bat --version
      - name: Android unit tests and debug assembly
        shell: pwsh
        timeout-minutes: 35
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $transcript = "artifacts/android-unit-debug-gradle.txt"
          try {
            & ./gradlew.bat :app:testDebugUnitTest :app:assembleDebug --no-daemon *>&1 |
              Tee-Object -FilePath $transcript
            if ($LASTEXITCODE -ne 0) {
              throw "Android unit/debug Gradle gate exited with code $LASTEXITCODE."
            }
          } catch {
            $_ | Out-String | Add-Content -LiteralPath $transcript
            throw
          }
      - name: Upload Android unit/debug evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 10
        with:
          name: android-unit-debug-evidence-${{ github.run_attempt }}
          path: |
            artifacts/android-unit-debug-gradle.txt
            app/build/reports/tests/
            app/build/test-results/
            app/build/outputs/apk/debug/
          if-no-files-found: error
          retention-days: 90

  android-release:
    name: android / release
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        timeout-minutes: 5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Determine Android release applicability
        id: release_applicability
        shell: pwsh
        timeout-minutes: 5
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $transcript = "artifacts/android-release-applicability.txt"
          try {
            & ./tools/ci/Invoke-AnotherLifeQualityGate.ps1 -Mode AndroidReleaseApplicability *>&1 |
              Tee-Object -FilePath $transcript
            if ($LASTEXITCODE -ne 0) {
              throw "Android release applicability exited with code $LASTEXITCODE."
            }
          } catch {
            $_ | Out-String | Add-Content -LiteralPath $transcript
            throw
          }
      - name: Set up JDK
        if: steps.release_applicability.outputs.applicable == 'true'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        timeout-minutes: 10
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle version
        if: steps.release_applicability.outputs.applicable == 'true'
        shell: pwsh
        timeout-minutes: 5
        run: ./gradlew.bat --version
      - name: Android release lint and assembly
        if: steps.release_applicability.outputs.applicable == 'true'
        shell: pwsh
        timeout-minutes: 35
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $transcript = "artifacts/android-release-gradle.txt"
          try {
            & ./gradlew.bat :app:lintRelease :app:assembleRelease --no-daemon *>&1 |
              Tee-Object -FilePath $transcript
            if ($LASTEXITCODE -ne 0) {
              throw "Android release Gradle gate exited with code $LASTEXITCODE."
            }
          } catch {
            $_ | Out-String | Add-Content -LiteralPath $transcript
            throw
          }
      - name: Upload Android release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 10
        with:
          name: android-release-evidence-${{ github.run_attempt }}
          path: |
            artifacts/android-release-applicability.txt
            artifacts/android-release-gradle.txt
            app/build/reports/tests/
            app/build/reports/lint-results-release*
            app/build/test-results/
            app/build/outputs/apk/release/
            app/build/outputs/mapping/
            app/build/outputs/logs/
          if-no-files-found: error
          retention-days: 90
