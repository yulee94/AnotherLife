<text x="461.1" y="369.7" text-anchor="start" fill="#f0ebdd" font-family="sans-serif" font-size="22.0" font-weight="700">INPUT FOCUS PATHS · ONE AUTHORITATIVE STATE</text>
<circle cx="489.1" cy="684.2" r="22" fill="none" stroke="#b8a988" stroke-width="3"/>
