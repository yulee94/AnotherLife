<text x="525.1" y="679.2" text-anchor="start" fill="#f0ebdd" font-family="sans-serif" font-size="17.0" font-weight="700">TOUCH: map toggle → filter → marker → close</text>
<text x="525.1" y="706.2" text-anchor="start" fill="#b8a988" font-family="sans-serif" font-size="13.0" font-weight="500">56-unit targets; no hover dependency</text>
